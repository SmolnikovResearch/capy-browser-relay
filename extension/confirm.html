<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Подтверждение</title>
<link rel="stylesheet" href="confirm.css">
</head>
<body>
<main>
  <p class="eyebrow">Нужно решение</p>
  <h1>Агент хочет сделать это в браузере</h1>
  <p class="who"><span id="agent"></span><span class="sep">·</span><span id="host"></span></p>
  <p id="what" class="what"></p>
  <label id="trustRow"><input type="checkbox" id="trust"><span>Больше не спрашивать на этом сайте <span id="mins"></span> минут. Оплату, удаление и файлы это не включает.</span></label>
  <div class="buttons">
    <button id="deny" type="button">Отклонить</button>
    <button id="allow" class="primary" type="button">Разрешить</button>
  </div>
  <p class="hint">Если не ответить за 25 секунд, действие не выполнится.</p>
</main>
<script src="confirm.js" type="module"></script>
</body>
</html>
